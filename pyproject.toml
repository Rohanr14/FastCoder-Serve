[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcoder-serve"
version = "0.1.0"
description = "Reproducible LLM inference serving and benchmarking foundation for FastCoder-Serve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohanr14" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
# HumanEval prompts/scoring. Pod-only; never installed in CI. The loader also accepts a local
# JSONL(.gz) via FASTCODER_HUMANEVAL_PATH, so this extra is optional even on the pod.
eval = [
  "human-eval @ git+https://github.com/openai/human-eval.git",
]

[tool.setuptools.packages.find]
include = ["fastcoder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fastcoder"]

[tool.mypy]
python_version = "3.11"
packages = ["fastcoder"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "prometheus_client.*", "yaml", "human_eval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
