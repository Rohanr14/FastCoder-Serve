[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcoder-serve"
version = "0.1.0"
description = "Honest, reproducible LLM inference benchmarking and serving: validated latency/throughput/quality/cost Pareto with SLO capacity analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohanr14" }]
keywords = ["llm", "inference", "benchmark", "vllm", "serving", "latency", "throughput", "slo", "quantization", "fp8"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
# HumanEval scoring needs the pod-only `human_eval` package, installed directly from GitHub
# (pip install git+https://github.com/openai/human-eval.git). It is intentionally NOT declared as a
# dependency/extra here, because PyPI rejects direct-URL dependencies. The loader also accepts a
# local JSONL(.gz) via FASTCODER_HUMANEVAL_PATH.

[project.urls]
Repository = "https://github.com/Rohanr14/FastCoder-Serve"
Writeup = "https://github.com/Rohanr14/FastCoder-Serve/blob/main/docs/writeup.md"

[project.scripts]
fastcoder = "fastcoder.cli:main"

[tool.setuptools.packages.find]
include = ["fastcoder*", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fastcoder"]

[tool.mypy]
python_version = "3.11"
packages = ["fastcoder"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "prometheus_client.*", "yaml", "human_eval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
