# H100 FP8 latency/throughput ablation. Same sweep as baseline_fp16.yaml for direct comparison.
# FP8 is vLLM online dynamic quantization (W8A8) of the FP16 weights — reuses the cached FP16
# checkpoint (no new download). Do not run locally. Launch vLLM with: --quantization fp8
experiment_name: baseline_fp8
model_server:
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  timeout_seconds: 120
  quantization: fp8
  dtype: fp16
  notes: Direct vLLM endpoint serving FP8 via online dynamic quantization (--quantization fp8).
expected_endpoints:
  direct_vllm: http://localhost:8000/v1
  gateway: http://localhost:8080/v1
workloads:
  - short_chat_256_256
  - long_context_4k_512
concurrency:
  - 1
  - 8
  - 32
  - 64
requests_per_workload_per_concurrency: 50
max_tokens: 512
temperature: 0
stream: true
output_path: results/baseline_fp8.json
vllm_version: null
serving_backend: vllm
backend_commit: null
speculative_method: null
speculative_model: null
speculative_notes: FP8 ablation uses no speculative decoding.
cost:
  accelerator_hourly_cost_usd: 2.20
hardware:
  gpu_name: NVIDIA H100 80GB HBM3
  gpu_memory_gb: 80
  provider: RunPod
  hourly_cost_usd: 2.20
software:
  vllm_version: null
  serving_backend: vllm
  backend_commit: null
speculation:
  method: null
  draft_model: null
  num_speculative_tokens: null
  acceptance_rate: null
  notes: FP8 ablation uses no speculative decoding.
measurement_hypothesis: Measure FP8 (W8A8) latency, throughput, GPU memory, and cost against the FP16 baseline on the identical sweep; quality is measured separately by configs/humaneval_fp8.yaml.
metadata:
  local_runnable: "false"
  warning: Requires an H100 vLLM server launched with --quantization fp8; do not run as local smoke.
  humaneval: pass@1 quality is measured separately by configs/humaneval_fp8.yaml, not in this sweep.
  comparison: Mirror of configs/baseline_fp16.yaml (same workloads/concurrency/requests) so results/baseline_fp8.json is directly comparable to results/baseline_fp16.json.
