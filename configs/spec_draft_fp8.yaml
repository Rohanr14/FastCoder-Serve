# H100 speculative-decoding ablation (FP8) — DRAFT-MODEL speculation.
# Qwen2.5-Coder-0.5B-Instruct drafts for the 7B target (same tokenizer family, required). Same sweep
# as baseline_fp8.yaml so results/spec_draft_fp8.json is directly comparable to results/baseline_fp8.json.
# The draft checkpoint is a separate ~1 GB download. Spec-decode flag syntax varies by vLLM version;
# confirm against `vllm serve --help` on the pod (see Week 4 of docs/runpod_setup.md). Do not run locally.
experiment_name: spec_draft_fp8
model_server:
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  timeout_seconds: 120
  quantization: fp8
  dtype: fp16
  notes: FP8 target with draft-model speculative decoding (draft = Qwen2.5-Coder-0.5B-Instruct).
expected_endpoints:
  direct_vllm: http://localhost:8000/v1
  gateway: http://localhost:8080/v1
workloads:
  - short_chat_256_256
  - long_context_4k_512
concurrency:
  - 1
  - 8
  - 32
  - 64
requests_per_workload_per_concurrency: 50
max_tokens: 512
temperature: 0
stream: true
output_path: results/spec_draft_fp8.json
vllm_version: null
serving_backend: vllm
backend_commit: null
speculative_method: draft
speculative_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
speculative_notes: Draft-model speculative decoding; 5 speculative tokens per step.
cost:
  accelerator_hourly_cost_usd: 2.20
hardware:
  gpu_name: NVIDIA H100 80GB HBM3
  gpu_memory_gb: 80
  provider: RunPod
  hourly_cost_usd: 2.20
software:
  vllm_version: null
  serving_backend: vllm
  backend_commit: null
speculation:
  method: draft
  draft_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
  num_speculative_tokens: 5
  acceptance_rate: null
  notes: Acceptance rate is read from vLLM /metrics after the run (scripts/capture_spec_acceptance.py) and recorded in methodology; null until measured.
measurement_hypothesis: Measure whether draft-model speculative decoding lowers latency/ITL versus baseline_fp8 at low concurrency, and how the gain changes as concurrency saturates the GPU; report drafted-token acceptance rate.
metadata:
  local_runnable: "false"
  warning: Requires an H100 FP8 vLLM server launched with draft-model speculative decoding; do not run as local smoke.
  comparison: Compare results/spec_draft_fp8.json vs results/baseline_fp8.json (same workloads/sweep; speculation is the only difference).
  acceptance_note: Spec decoding does not change outputs (verified tokens), so HumanEval quality is unchanged and not re-run.
