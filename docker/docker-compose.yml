services:
  fake-upstream:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    command: ["python", "scripts/fake_openai_server.py", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      FASTCODER_API_KEY: dev-token
      VLLM_BASE_URL: http://fake-upstream:9000/v1
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      - fake-upstream

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
