# One-command, CPU-only observability demo:
#   docker compose -f docker/docker-compose.yml up --build
# Gateway -> fake OpenAI server, Prometheus scrapes the gateway, Grafana auto-loads the dashboard,
# and `load` drives continuous traffic so the dashboard is live. No GPU, no model download.
services:
  fake-upstream:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    command: ["python", "scripts/fake_openai_server.py", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      FASTCODER_API_KEY: dev-token
      VLLM_BASE_URL: http://fake-upstream:9000/v1
      LOG_LEVEL: INFO
      # High limit so the demo shows healthy throughput; lower it to watch the gateway shed load
      # with HTTP 429s (visible live in the "request rate by HTTP status" panel).
      FASTCODER_RATE_LIMIT_PER_MINUTE: "1000000"
    ports:
      - "8000:8000"
    depends_on:
      - fake-upstream

  load:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    command:
      - "python"
      - "scripts/demo_load.py"
      - "--base-url"
      - "http://gateway:8000/v1"
      - "--api-key"
      - "dev-token"
      - "--concurrency"
      - "8"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/fastcoder-dashboard.json:/var/lib/grafana/dashboards/fastcoder-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
